<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Transcript - Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body data-page="grades">
  <header class="site-header">
    <a class="brand" href="index.html">Student Portal</a>
    <nav aria-label="Main">
      <a href="index.html">Overview</a>
      <a href="profile.html">Profile</a>
      <a href="courses.html">Courses</a>
      <a href="grades.html" aria-current="page">Grades</a>
    </nav>
    <div class="tools">
      <button class="btn" id="theme-toggle" type="button">Dark mode</button>
      <button class="btn" id="sign-out" type="button">Sign out</button>
    </div>
  </header>
  <main class="container">
    <h1>Academic Transcript</h1>
    <p class="muted">Edit a score to see how it changes your GPA.</p>
    <div class="table-wrap">
      <table>
        <caption>Semester 2 results</caption>
        <thead><tr><th>Code</th><th>Title</th><th>Credits</th><th>Score</th><th>Grade</th></tr></thead>
        <tbody id="grade-rows"></tbody>
        <tfoot>
          <tr><td colspan="4">Semester GPA</td><td id="sem-gpa">-</td></tr>
          <tr><td colspan="4">Cumulative GPA</td><td id="cum-gpa">-</td></tr>
        </tfoot>
      </table>
    </div>
  </main>
  <footer class="site-footer">&copy; 2026 Dynamic Student Portal</footer>
  <script src="js/portal-data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/grade-calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
