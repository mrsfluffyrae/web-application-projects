<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses - Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body data-page="courses">
  <header class="site-header">
    <a class="brand" href="index.html">Student Portal</a>
    <nav aria-label="Main">
      <a href="index.html">Overview</a>
      <a href="profile.html">Profile</a>
      <a href="courses.html" aria-current="page">Courses</a>
      <a href="grades.html">Grades</a>
    </nav>
    <div class="tools">
      <button class="btn" id="theme-toggle" type="button">Dark mode</button>
      <button class="btn" id="sign-out" type="button">Sign out</button>
    </div>
  </header>
  <main class="container">
    <h1>Enrolled Courses - Semester 2</h1>
    <p class="muted" id="total"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Code</th><th>Title</th><th>Schedule</th><th>Venue</th><th>Credits</th><th><span class="sr">Action</span></th></tr></thead>
        <tbody id="enrolled-rows"></tbody>
      </table>
    </div>
    <h2>Register a Course</h2>
    <form class="form" id="course-form" novalidate style="margin-top:var(--s3)">
      <div class="field"><label for="course">Available courses</label><select id="course" name="course"></select><p class="error" id="course-error"></p></div>
      <div><button class="btn btn-primary" type="submit">Register Course</button></div>
    </form>
  </main>
  <footer class="site-footer">&copy; 2026 Dynamic Student Portal</footer>
  <script src="js/portal-data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/grade-calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
