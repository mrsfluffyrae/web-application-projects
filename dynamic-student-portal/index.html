<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Overview - Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="index">
  <header class="site-header">
    <a class="brand" href="index.html">Student Portal</a>
    <nav aria-label="Main">
      <a href="index.html" aria-current="page">Overview</a>
      <a href="profile.html">Profile</a>
      <a href="courses.html">Courses</a>
      <a href="grades.html">Grades</a>
    </nav>
    <div class="tools">
      <button class="btn" id="theme-toggle" type="button">Dark mode</button>
      <button class="btn" id="sign-out" type="button">Sign out</button>
    </div>
  </header>
  <main class="container">
    <h1>Academic Overview</h1>
    <p class="muted" id="greeting"></p>
    <div class="overview">
      <section class="card feature" aria-labelledby="sched-h">
        <div class="card-head"><h2 id="sched-h">Today's Schedule</h2><span class="muted" id="today-label"></span></div>
        <ol class="schedule" id="schedule"></ol>
      </section>
      <section class="card" aria-labelledby="gpa-h">
        <h2 id="gpa-h">Cumulative GPA</h2>
        <p class="gpa-value" id="gpa">-</p>
        <div class="bar"><span id="gpa-bar"></span></div>
        <p class="muted" id="gpa-note"></p>
      </section>
    </div>
    <dl class="stats" id="stats"></dl>
    <div class="split">
      <section><h2>GPA by Semester</h2><div class="chart" id="chart" role="img" aria-label="GPA by semester bar chart"></div></section>
      <section>
        <h2>Registered Students</h2>
        <button class="btn" id="show-students" type="button">Show Registered Students</button>
        <ul id="student-list"></ul>
        <p class="muted" id="student-count"></p>
      </section>
    </div>
  </main>
  <footer class="site-footer">&copy; 2026 Dynamic Student Portal</footer>
  <script src="js/portal-data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/grade-calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
