<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="login-page" data-page="login">
  <main class="login-card">
    <h1>Sign in to Student Portal</h1>
    <p class="muted">Demo: amina.wanjiru@student.edu / portal123</p>
    <form class="form" id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username"><p class="error" id="email-error"></p></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><p class="error" id="password-error"></p></div>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Sign In</button>
    </form>
    <button class="btn" id="theme-toggle" type="button" style="margin-top:var(--s4)">Dark mode</button>
  </main>
  <script src="js/portal-data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
